name: deploy

# manual only: Actions -> deploy -> Run workflow, pick a branch or a tag in "Use workflow from"
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # never cancel a running deploy half-way; a newer run waits for it
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip-lighthouse: true
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nuxt-cache: 'true'
      - run: pnpm generate
        env:
          NITRO_PRESET: github_pages
          # `/` with a custom domain (vars.BASE_URL), otherwise the project-page subpath
          NUXT_APP_BASE_URL: ${{ vars.BASE_URL || format('/{0}/', github.event.repository.name) }}
          # origin only, e.g. https://user.github.io (the base path is appended by the modules)
          NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      # warns while content is placeholder; a `release*` tag makes it a hard gate
      - run: node scripts/check-placeholders.mjs ${{ startsWith(github.ref, 'refs/tags/release') && '--strict' || '' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
