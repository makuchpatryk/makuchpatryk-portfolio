name: deploy

on:
  push:
    branches: [main]
    tags: ['release*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
        env:
          NITRO_PRESET: github_pages
          # `/` with a custom domain (vars.BASE_URL), otherwise the project-page subpath
          NUXT_APP_BASE_URL: ${{ vars.BASE_URL || format('/{0}/', github.event.repository.name) }}
          # origin only, e.g. https://user.github.io (the base path is appended by the modules)
          NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      # warns while content is placeholder; a `release*` tag makes it a hard gate
      - run: node scripts/check-placeholders.mjs ${{ startsWith(github.ref, 'refs/tags/release') && '--strict' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
